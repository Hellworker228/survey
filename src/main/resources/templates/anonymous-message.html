<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">Анкета - SurveySystem</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="surveys-page">
<nav th:replace="~{fragments :: navbar('')}"></nav>

<div th:replace="~{fragments :: messages}"></div>

<div class="container text-center py-5">
    <i class="bi bi-incognito" style="font-size: 4rem; color: var(--text-light);"></i>
    <h2 class="mt-4" th:text="${title}">Спасибо за участие!</h2>
    <p class="text-muted" th:text="${survey.title}">Название анкеты</p>
    <p class="lead" th:text="${text}">Ваши ответы сохранены</p>

    <div th:if="${percent != null}" class="my-4">
        <div class="display-4 fw-bold" th:text="${percent + '%'}">80%</div>
        <div class="text-muted">
            Правильных ответов: <span th:text="${correct}">4</span> из <span th:text="${graded}">5</span>
        </div>
    </div>

    <a th:if="${session.userId != null}" th:href="@{/surveys}" class="btn btn-primary btn-lg px-5 mt-3">К списку анкет</a>
    <a th:if="${session.userId == null}" th:href="@{/}" class="btn btn-primary btn-lg px-5 mt-3">На главную</a>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
