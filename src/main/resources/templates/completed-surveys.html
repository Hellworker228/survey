<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пройденные анкеты - SurveySystem</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="surveys-page">
<nav th:replace="~{fragments :: navbar('completed')}"></nav>

<div class="surveys-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-8">
                <h1>Пройденные анкеты</h1>
                <p>История ваших ответов и участия в опросах</p>
            </div>
            <div class="col-lg-4 text-lg-end mt-3 mt-lg-0">
                <a th:href="@{/surveys}" class="btn btn-light btn-lg px-4">
                    <i class="bi bi-plus-circle me-2"></i>Пройти новую анкету
                </a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: messages}"></div>

<div class="container">
    <div class="row g-3 mb-5">
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${results.size()}">0</div>
                <div class="text-muted">Всего пройдено</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${totalScore != null ? totalScore + '%' : '—'}">—</div>
                <div class="text-muted">Средний результат</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${lastActivity}">—</div>
                <div class="text-muted">Последняя активность</div>
            </div>
        </div>
    </div>

    <div th:if="${!results.isEmpty()}" class="row g-4 mb-5">
        <div th:each="result : ${results}" class="col-md-6 col-lg-4">
            <div class="survey-card">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <span class="survey-badge"><i class="bi bi-check-circle-fill me-1"></i>Пройдена</span>
                        <small class="text-muted">
                            <i class="bi bi-calendar3"></i>
                            <span th:text="${result.submittedAt != null ? #temporals.format(result.submittedAt, 'dd.MM.yyyy') : '—'}">01.01.2030</span>
                        </small>
                    </div>
                    <h5 class="card-title" th:text="${result.surveyTitle}">Название анкеты</h5>
                    <p class="card-text" th:text="${result.surveyDescription}">Описание</p>

                    <div th:if="${result.graded}">
                        <div class="progress mb-2" style="height: 8px;">
                            <div class="progress-bar bg-success" role="progressbar"
                                 th:style="'width: ' + ${result.percent} + '%'"></div>
                        </div>
                        <div class="small text-muted mb-3"
                             th:text="${result.percent + '% · ' + result.correctCount + ' из ' + result.gradedCount}">80%</div>
                    </div>

                    <div class="text-end">
                        <a th:href="@{/survey/{id}/results(id=${result.surveyId})}" class="btn btn-outline-primary btn-sm">
                            <i class="bi bi-eye me-2"></i>Результаты
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:if="${results.isEmpty()}" class="text-center py-5">
        <i class="bi bi-archive" style="font-size: 4rem; color: var(--text-light);"></i>
        <h3 class="mt-4">Вы ещё не проходили анкеты</h3>
        <p class="text-muted mb-4">Выберите анкету и примите участие в опросе</p>
        <a th:href="@{/surveys}" class="btn btn-primary btn-lg px-5">К списку анкет</a>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
