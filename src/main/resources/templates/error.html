<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ошибка - SurveySystem</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="surveys-page">
<nav th:replace="~{fragments :: navbar('')}"></nav>

<div class="container text-center py-5">
    <i class="bi bi-exclamation-octagon" style="font-size: 4rem; color: var(--text-light);"></i>
    <h1 class="mt-4" th:text="${status != null ? status : 'Ошибка'}">404</h1>
    <p class="lead text-muted" th:switch="${status}">
        <span th:case="404">Страница или анкета не найдена</span>
        <span th:case="403">Доступ запрещён</span>
        <span th:case="401">Необходимо войти в систему</span>
        <span th:case="*" th:text="${message != null and !#strings.isEmpty(message) ? message : 'Что-то пошло не так'}">Что-то пошло не так</span>
    </p>
    <a th:href="@{/surveys}" class="btn btn-primary btn-lg px-5">К списку анкет</a>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
