<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<nav th:fragment="navbar(active)" class="navbar navbar-expand-lg navbar-dark"
     style="background: linear-gradient(135deg, #4e73df 0%, #224abe 100%);">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">
            <i class="bi bi-clipboard-check me-2"></i>SurveySystem
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'surveys'} ? 'active' : ''" th:href="@{/surveys}">Анкеты</a>
                </li>
                <li th:if="${session.userId != null}" class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'my'} ? 'active' : ''" th:href="@{/my-surveys}">Мои анкеты</a>
                </li>
                <li th:if="${session.userId != null}" class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'completed'} ? 'active' : ''" th:href="@{/completed-surveys}">Пройденные</a>
                </li>
                <li th:if="${session.userId != null and session.isAdmin == true}" class="nav-item">
                    <a class="nav-link" th:href="@{/admin}">Админ-панель</a>
                </li>
                <li th:if="${session.userId == null}" class="nav-item">
                    <a class="nav-link" th:href="@{/login}">Войти</a>
                </li>
                <li th:if="${session.userId == null}" class="nav-item">
                    <a class="nav-link" th:href="@{/registration}">Регистрация</a>
                </li>
                <li th:if="${session.userId != null}" class="nav-item">
                    <a class="nav-link" th:classappend="${active == 'profile'} ? 'active' : ''" th:href="@{/profile}">
                        <i class="bi bi-person-circle me-1"></i>
                        <span th:text="${session.username}">Пользователь</span>
                    </a>
                </li>
                <li th:if="${session.userId != null}" class="nav-item">
                    <a class="nav-link" th:href="@{/logout}">Выйти</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="messages" class="container mt-3">
    <div th:if="${error}" class="alert alert-danger" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i><span th:text="${error}">Ошибка</span>
    </div>
    <div th:if="${success}" class="alert alert-success" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i><span th:text="${success}">Готово</span>
    </div>
</div>

</body>
</html>
