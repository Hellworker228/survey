<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация - SurveySystem</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="login-page">
<div class="login-container">
    <div class="login-card">
        <div class="login-header">
            <i class="bi bi-person-plus" style="font-size: 3rem; margin-bottom: 15px;"></i>
            <h2>Создать аккаунт</h2>
            <p>Зарегистрируйтесь для участия в опросах</p>
        </div>

        <div class="login-body">
            <div th:if="${error}" class="alert alert-custom alert-danger-custom" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${error}">Ошибка регистрации</span>
            </div>

            <form th:action="@{/registration}" th:object="${user}" method="post">
                <input type="hidden" name="_csrf" th:value="${csrfToken}">
                <div class="mb-4">
                    <label for="username" class="form-label-custom">
                        <i class="bi bi-person me-2"></i>Имя пользователя
                    </label>
                    <input type="text" class="form-control-custom" id="username"
                           th:field="*{username}" placeholder="Придумайте username" minlength="3" maxlength="50" required>
                </div>

                <div class="mb-4">
                    <label for="email" class="form-label-custom">
                        <i class="bi bi-envelope me-2"></i>Email
                    </label>
                    <input type="email" class="form-control-custom" id="email"
                           th:field="*{email}" placeholder="Введите email" required>
                </div>

                <div class="mb-4">
                    <label for="password" class="form-label-custom">
                        <i class="bi bi-lock me-2"></i>Пароль
                    </label>
                    <input type="password" class="form-control-custom" id="password"
                           th:field="*{password}" placeholder="Придумайте пароль (минимум 6 символов)" minlength="6" maxlength="72" required>
                </div>

                <button type="submit" class="btn-login">
                    <i class="bi bi-person-plus me-2"></i>Зарегистрироваться
                </button>
            </form>
        </div>

        <div class="login-footer">
            <p class="mb-2">
                <i class="bi bi-box-arrow-in-right me-1"></i>
                Уже есть аккаунт? <a th:href="@{/login}">Войти</a>
            </p>
            <p class="mb-0">
                <i class="bi bi-house me-1"></i>
                <a href="/index">Вернуться на главную</a>
            </p>
        </div>
    </div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
