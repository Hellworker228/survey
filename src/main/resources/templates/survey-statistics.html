<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Статистика - SurveySystem</title>
    <link th:href="@{/css/bootstrap.min.css}" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link th:href="@{/css/style.css}" rel="stylesheet">
</head>
<body class="surveys-page">
<nav th:replace="~{fragments :: navbar('my')}"></nav>

<div class="surveys-header">
    <div class="container">
        <div class="row align-items-center">
            <div class="col-lg-8">
                <h1 th:text="${survey.title}">Название анкеты</h1>
                <p>Статистика ответов</p>
            </div>
            <div class="col-lg-4 text-lg-end mt-3 mt-lg-0 d-flex gap-2 justify-content-lg-end">
                <a th:href="@{/survey/{id}/edit(id=${survey.id})}" class="btn btn-light"><i class="bi bi-pencil me-1"></i>Редактор</a>
                <a th:href="@{/survey/{id}/export(id=${survey.id})}" class="btn btn-light"><i class="bi bi-file-earmark-excel me-1"></i>Excel</a>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: messages}"></div>

<div class="container mb-5">
    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${stats.responsesCount}">0</div>
                <div class="text-muted">Прохождений</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${stats.questions.size()}">0</div>
                <div class="text-muted">Вопросов</div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="profile-card text-center p-4">
                <div class="fs-2 fw-bold" th:text="${stats.averagePercent != null ? stats.averagePercent + '%' : '—'}">—</div>
                <div class="text-muted">Средний результат</div>
            </div>
        </div>
    </div>

    <div th:each="qs, iter : ${stats.questions}" class="card border-0 shadow-sm mb-4" style="border-radius: 15px;">
        <div class="card-header bg-white d-flex justify-content-between align-items-center">
            <span class="fw-bold" th:text="${iter.count + '. ' + qs.question.content}">Вопрос</span>
            <span class="badge bg-light text-dark" th:text="${'Ответили: ' + qs.answered}">Ответили: 0</span>
        </div>
        <div class="card-body p-4">
            <div th:if="${qs.question.choice}">
                <div th:each="option : ${qs.question.options}" class="mb-3">
                    <div class="d-flex justify-content-between small mb-1">
                        <span>
                            <span th:text="${option.content}">Вариант</span>
                            <i th:if="${qs.question.correctOptionId != null and qs.question.correctOptionId == option.id}"
                               class="bi bi-check-circle-fill text-success ms-1" title="Правильный ответ"></i>
                        </span>
                        <span th:text="${option.answersCount + ' · ' + option.percent + '%'}">0 · 0%</span>
                    </div>
                    <div class="progress" style="height: 10px;">
                        <div class="progress-bar" role="progressbar"
                             th:classappend="${qs.question.correctOptionId != null and qs.question.correctOptionId == option.id} ? 'bg-success' : ''"
                             th:style="'width: ' + ${option.percent} + '%'"></div>
                    </div>
                </div>
                <div th:if="${qs.question.options.isEmpty()}" class="text-muted">У вопроса нет вариантов</div>
            </div>
            <div th:if="${qs.question.text}">
                <ul class="list-group" th:if="${!qs.texts.isEmpty()}">
                    <li th:each="text : ${qs.texts}" class="list-group-item" th:text="${text}">Ответ</li>
                </ul>
                <div th:if="${qs.texts.isEmpty()}" class="text-muted">Текстовых ответов пока нет</div>
            </div>
        </div>
    </div>

    <div th:if="${stats.questions.isEmpty()}" class="alert alert-info">В анкете пока нет вопросов.</div>
</div>

<script th:src="@{/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
